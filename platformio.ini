; Jump tracker: ESP32 NodeMCU (WROOM-32, 38-pin) + Grove ADXL345 on I2C (SDA 21, SCL 22)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
; BLE (Bluedroid) needs ~1.1 MB; huge_app gives a 3 MB app slot (no OTA).
board_build.partitions = huge_app.csv
; CP2102 handles 921600 reliably; drop to 460800 if uploads fail with a long cable.
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = *
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit ADXL345 @ ^1.3.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Host-side unit tests for lib/jump_detector: `pio test -e native`
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
